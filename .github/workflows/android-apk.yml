name: APK Android (release)

# Compile l'APK installable manuellement. Lancement : onglet Actions → « APK Android (release) » → Run workflow,
# ou automatiquement à chaque tag v*. L'APK se télécharge dans les « Artifacts » de l'exécution.
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "URL du backend intégrée par défaut (modifiable ensuite dans l'application)"
        required: false
      publish_branch:
        description: "Déposer aussi l'APK sur la branche apk-builds (téléchargement via git)"
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Signature optionnelle avec votre propre clé (secrets GitHub). Sans ces secrets : clé de debug (installable).
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          PROPS
      - name: Compiler l'APK release
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || vars.BACKEND_URL }}
        run: flutter build apk --release --dart-define=BACKEND_URL=${BACKEND_URL:-https://exemple.up.railway.app}
      - uses: actions/upload-artifact@v4
        with:
          name: wa-automation-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Déposer l'APK sur la branche apk-builds
        if: github.event.inputs.publish_branch == 'true'
        run: |
          mkdir -p /tmp/apk && cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk/WA-Automation.apk
          cd /tmp/apk
          git init -q -b apk-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add WA-Automation.apk
          git commit -q -m "APK ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
